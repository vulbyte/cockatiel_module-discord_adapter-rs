[package]
name = "discord-adapter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "24464af1b6664c88bde4b22ad6326dd40223c40c" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# 0.5.x is the line built against the reqwest 0.11 this crate pins (0.6 moved
# to reqwest 0.12).
wiremock = "0.5"
