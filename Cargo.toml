[package]
name = "discord-adapter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "046e9f6ee4d2e0f3f499d1ce5e34540514be9277" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v7"] }